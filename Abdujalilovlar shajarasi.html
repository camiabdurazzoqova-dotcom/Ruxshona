body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(12,16,34,.5),rgba(12,16,34,.72));pointer-events:none}
#vp{position:fixed;inset:0;touch-action:none;cursor:grab}
#vp.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
path{fill:none;stroke-width:2.5;stroke-linecap:round;opacity:.6;transition:opacity .25s,stroke-width .25s}
path.on{opacity:1;stroke-width:4}
.c{position:absolute;height:124px;padding:11px 8px 8px;border-radius:46px;display:flex;flex-direction:column;align-items:center;text-align:center;
background:linear-gradient(180deg,rgba(24,24,50,.82),rgba(10,12,28,.92));border:1px solid var(--a);box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 0 26px -10px var(--a);transition:opacity .25s,transform .25s;cursor:pointer;user-select:none}
.c:hover{transform:translateY(-3px)}
.c.on{box-shadow:0 0 0 2px var(--a),0 0 34px var(--a),inset 0 0 26px -10px var(--a)}
.c.dim,.dimp{opacity:.28}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:radial-gradient(circle at 35% 28%,#fffc,var(--a) 70%);box-shadow:0 0 18px var(--a);flex:none}
.c b{font:700 17px/1.05 "Cormorant Garamond",Georgia,serif;margin-top:6px;padding:0 2px}
.c small{font-size:10.5px;color:var(--mute);margin-top:3px}
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 24px;pointer-events:none;background:linear-gradient(rgba(10,12,26,.75),transparent)}
.top h1{margin:0;font:700 clamp(24px,6vw,38px)/1.05 "Cormorant Garamond",Georgia,serif}
.top p{margin:4px 0 0;color:var(--mute);font-size:12.5px}
.ctl{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:8px}
.ctl button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(14,16,36,.72);backdrop-filter:blur(8px);color:var(--ink);font:600 22px/1 Manrope,sans-serif;cursor:pointer}
.ctl button:hover{background:rgba(40,44,80,.85)}
.ctl button:focus-visible,.c:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="vp"><div id="stage"><svg id="svg"></svg></div></div>
<div class="top"><h1>Abdujalilovlar shajarasi</h1><p>Suring · ikki barmoq bilan kattalashtiring · ismni bosing — nasabi yonadi</p></div>
<div class="ctl"><button id="zi" aria-label="Kattalashtirish">+</button><button id="zo" aria-label="Kichiklashtirish">−</button><button id="fit" aria-label="Hammasini sig‘dirish">⤢</button></div>
<script>
const T={n:"Bobajon",y:"yillari noma’lum",sp:"Fotima",k:[{n:"Abdulloh",y:"yili noma’lum"},
{n:"Abdujalil",y:"1878–1961",sp:"Jannat oyi",sy:"1886–1964",k:[{n:"Nazira",y:"yili noma’lum"},{n:"Oynisa",y:"yili noma’lum"},{n:"Qutbinsa",y:"yili noma’lum"},{n:"Oʻgʻiloy",y:"yili noma’lum"},{n:"Abdumajid",y:"yili noma’lum"},
{n:"Abdugʻofur",y:"1929–1984",sp:"Jamila",sy:"1929–1992",k:[
{n:"Abduxakim",y:"1950",sp:"Muhayyo",sy:"1957",k:[{n:"Abdurashid",y:"1978"},
{n:"Abduazim",y:"1981",sp:"Zahro",sy:"1986",k:[{n:"Ruxsora",y:"2006"},{n:"Ruxshona",y:"2009"},{n:"Ziyoda",y:"2015"},{n:"Madina",y:"2020"},{n:"Muslima",y:"2023"}]},
{n:"Abduxalil",y:"1986"},{n:"Muxlisa",y:"1990"}]},
{n:"Nabira",y:"1952–2009"},{n:"Abdumalik",y:"1954"},{n:"Abdugʻani",y:"1956"},{n:"Abduqahhor",y:"1959"},{n:"Margʻuba",y:"1963"},{n:"Abdurayim",y:"1965"}]}]},
{n:"Abduvali",y:"yili noma’lum"},{n:"Tosh",y:"yili noma’lum"}]};
const COL=["#f4c95d","#ff9a62","#f0699a","#59b8f0","#b08cff"],EM=["🏔️","🌾","🌳","🌻","🌸"];
const CW=124,CPW=178,H=124,GX=14,GY=66;
const st=document.getElementById('stage'),svg=document.getElementById('svg'),vp=document.getElementById('vp');
const all=[];
function size(n){n.w=n.sp?CPW:CW;const k=n.k||[];n.sw=k.length?Math.max(n.w,k.reduce((a,c)=>a+size(c),0)+GX*(k.length-1)):n.w;return n.sw}
function place(n,l,d,p){n.x=l+n.sw/2;n.y=24+d*(H+GY);n.d=d;n.p=p;all.push(n);const k=n.k||[];
if(k.length){let t=k.reduce((a,c)=>a+c.sw,0)+GX*(k.length-1),x=l+(n.sw-t)/2;k.forEach(c=>{place(c,x,d+1,n);x+=c.sw+GX})}}
size(T);place(T,20,0,null);
const W=T.sw+40,Ht=24+5*(H+GY);
st.style.width=W+'px';st.style.height=Ht+'px';svg.setAttribute('width',W);svg.setAttribute('height',Ht);
all.forEach(n=>{const a=COL[Math.min(n.d,4)];
const e=document.createElement('div');e.className='c';e.tabIndex=0;e.style.cssText=`--a:${a};width:${n.w}px;left:${n.x-n.w/2}px;top:${n.y}px`;
const nm=n.sp?n.n+' va '+n.sp:n.n,yr=n.sp?[n.y,n.sy].filter(Boolean).join(' · '):(n.y||'');
e.innerHTML=`<div class="av">${EM[Math.min(n.d,4)]}</div><b></b>${yr?'<small></small>':''}`;
e.children[1].textContent=nm;if(yr)e.children[2].textContent=yr;n.el=e;st.append(e);
if(n.p){const p=n.p,y0=p.y+H,y1=n.y,m=(y0+y1)/2;
const s=document.createElementNS('http://www.w3.org/2000/svg','path');
s.setAttribute('d',`M${p.x} ${y0}C${p.x} ${m} ${n.x} ${m} ${n.x} ${y1}`);s.setAttribute('stroke',a);svg.append(s);n.pa=s}});
// qaysi ismni bossa — nasab chizig'i yonadi
function pick(n){const on=new Set();for(let x=n;x;x=x.p)on.add(x);
all.forEach(m=>{const i=on.has(m);m.el.classList.toggle('on',i&&!!n);m.el.classList.toggle('dim',!!n&&!i);if(m.pa){m.pa.classList.toggle('on',i&&!!n);m.pa.classList.toggle('dimp',!!n&&!i)}})}
all.forEach(n=>n.el.addEventListener('click',e=>{if(moved)return;e.stopPropagation();pick(n)}));
// kattalashtirish / surish
let s=.8,tx=0,ty=0,moved=false;const P=new Map();
const ap=()=>st.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
function zoom(cx,cy,f){const ns=Math.min(2.5,Math.max(.12,s*f)),r=ns/s;tx=cx-(cx-tx)*r;ty=cy-(cy-ty)*r;s=ns;ap()}
function home(){s=Math.min(.9,innerWidth/520);tx=innerWidth/2-T.x*s;ty=90;ap()}
function fit(){s=Math.max(.12,Math.min(1,(innerWidth-30)/W,(innerHeight-120)/Ht));tx=(innerWidth-W*s)/2;ty=100;ap()}
const dist=()=>{const a=[...P.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)},mid=()=>{const a=[...P.values()];return[(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2]};
let ld=0,sx=0,sy=0;
vp.addEventListener('pointerdown',e=>{P.set(e.pointerId,{x:e.clientX,y:e.clientY});sx=e.clientX;sy=e.clientY;moved=false;if(P.size==2)ld=dist()});
addEventListener('pointermove',e=>{const o=P.get(e.pointerId);if(!o)return;
if(Math.hypot(e.clientX-sx,e.clientY-sy)>6){moved=true;vp.classList.add('drag')}
if(P.size==1){tx+=e.clientX-o.x;ty+=e.clientY-o.y;o.x=e.clientX;o.y=e.clientY;if(moved)ap()}
else if(P.size==2){const [m0x,m0y]=mid();o.x=e.clientX;o.y=e.clientY;const d=dist(),[mx,my]=mid();tx+=mx-m0x;ty+=my-m0y;zoom(mx,my,d/ld);ld=d;moved=true}});
const up=e=>{P.delete(e.pointerId);vp.classList.remove('drag');if(P.size==1){const o=[...P.values()][0];sx=o.x;sy=o.y}setTimeout(()=>{if(!P.size)moved=false},0)};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
vp.addEventListener('click',e=>{if(!moved&&!e.target.closest('.c'))pick(null)});
vp.addEventListener('wheel',e=>{e.preventDefault();zoom(e.clientX,e.clientY,e.deltaY<0?1.12:.89)},{passive:false});
document.getElementById('zi').onclick=()=>zoom(innerWidth/2,innerHeight/2,1.3);
document.getElementById('zo').onclick=()=>zoom(innerWidth/2,innerHeight/2,.77);
document.getElementById('fit').onclick=fit;
addEventListener('resize',home);home();
</script></body></html>
